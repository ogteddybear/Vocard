app = "vocard-mongodb"
primary_region = "sin"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
dockerfile = "mongodb/Dockerfile"

[env]
MONGO_INITDB_ROOT_USERNAME = "vocard_admin"
MONGO_INITDB_DATABASE = "vocard"

[mounts]
source = "vocard_mongodb_data"
destination = "/data/db"
initial_size = "1gb"

# MongoDB is private to the Fly organization; create one volume and one machine.
[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
