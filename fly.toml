# fly.toml app configuration file generated for vocard-bot on 2026-11-23T17:16:01Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'vocard-bot'
primary_region = 'sin'
kill_signal = 'SIGINT'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  LAVALINK_HOST = 'vocard-lavalink.internal'
  LAVALINK_PORT = '2333'
  LAVALINK_SECURE = 'false'
  MONGODB_NAME = 'vocard'

[processes]
  app = 'python -u main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
